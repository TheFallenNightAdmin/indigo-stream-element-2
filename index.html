<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IndigoXEcho — Exit Scene</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#7B3FE4; --purple-lt:#A97BFF;
  --cyan:#00E5FF;
  --bg0:#07030F; --bg1:#12062B;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg0);
  font-family:'Chakra Petch',sans-serif;color:#fff}
.stage{position:relative;width:1920px;height:1080px;display:grid;place-items:center;
  background:
    radial-gradient(ellipse 70% 55% at 50% 45%, rgba(123,63,228,.34), transparent 70%),
    radial-gradient(ellipse 40% 30% at 50% 100%, rgba(0,229,255,.16), transparent 70%),
    linear-gradient(180deg,var(--bg0),var(--bg1) 60%,var(--bg0));
}
.grid{position:absolute;inset:0;overflow:hidden;opacity:.45}
.grid::before{content:"";position:absolute;left:-50%;right:-50%;bottom:-40%;height:110%;
  background-image:linear-gradient(rgba(0,229,255,.20) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(123,63,228,.18) 1px,transparent 1px);
  background-size:90px 90px;
  transform:perspective(600px) rotateX(70deg);
  animation:scroll 7s linear infinite;
  mask-image:linear-gradient(transparent,#000 55%);
  -webkit-mask-image:linear-gradient(transparent,#000 55%);
}
@keyframes scroll{to{background-position:0 90px}}
.scan{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(transparent 0 3px, rgba(0,0,0,.30) 3px 4px);opacity:.5}
.vig{position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 300px 90px rgba(0,0,0,.9)}

.wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  animation:rise .9s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}

.mascot{width:300px;filter:drop-shadow(0 0 28px rgba(123,63,228,.95)) drop-shadow(0 0 60px rgba(0,229,255,.35));
  animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

.title{font-family:'Orbitron',sans-serif;font-weight:900;font-size:120px;line-height:.98;
  letter-spacing:6px;text-align:center;margin-top:28px;text-transform:uppercase;
  background:linear-gradient(180deg,#fff 0%,var(--purple-lt) 40%,var(--purple) 66%,var(--cyan) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(123,63,228,.8)) drop-shadow(0 0 60px rgba(0,229,255,.3))}

.rule{margin:30px 0 22px;width:720px;height:2px;
  background:linear-gradient(90deg,transparent,var(--purple),var(--cyan),var(--purple),transparent);
  box-shadow:0 0 20px rgba(0,229,255,.6)}

.sub{font-size:28px;letter-spacing:12px;text-transform:uppercase;color:rgba(255,255,255,.62)}

.name{margin-top:44px;font-family:'Orbitron',sans-serif;font-weight:700;font-size:38px;
  letter-spacing:16px;color:#fff;
  text-shadow:0 0 16px rgba(123,63,228,.9), 0 0 44px rgba(0,229,255,.45)}

.socials{margin-top:26px;display:flex;gap:44px;font-size:20px;letter-spacing:4px;
  color:rgba(255,255,255,.5);text-transform:uppercase}
.socials b{color:var(--cyan);font-weight:600}
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>

  <div class="wrap">
    <img class="mascot" src="./mascot.png" alt="">
    <div class="title">Thanks for<br>Watching</div>
    <div class="rule"></div>
    <div class="sub">See You Next Stream</div>
    <div class="name">INDIGOXECHO</div>
    <div class="socials">
      <span><b>Discord</b> /IndigoEcho</span>
      <span><b>TikTok</b> @indigoxecho</span>
      <span><b>X</b> @IndigoXEcho</span>
      <span><b>YouTube</b> /IndigoXEcho</span>
    </div>
  </div>

  <div class="scan"></div>
  <div class="vig"></div>
</div>
</body>
</html>
